<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy credits — Runpik</title>
  <meta name="description" content="Scan the code with your phone to buy Runpik credits in the app.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
</head>
<body>

<main class="buywrap">
  <a class="buyback" href="index.html#pricing">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6"/><path d="m12 19-7-7 7-7"/></svg>
    <span data-bx="back">All packs</span>
  </a>

  <div class="buycard">
    <img class="buyicon" data-bx="icon" alt="" width="72" height="72">
    <h1 class="buyttl" data-bx="title">—</h1>
    <div class="buymeta"><span data-bx="credits"></span><span class="buydot">·</span><span data-bx="price"></span></div>

    <div class="qrbox"><div id="qr"></div></div>

    <p class="buylead" data-bx="lead"></p>
    <p class="buynote" data-bx="note"></p>

    <div class="buystores">
      <a class="buystore" data-bx="appstore" href="#" target="_blank" rel="noopener">App Store</a>
      <a class="buystore" data-bx="play" href="#" target="_blank" rel="noopener">Google Play</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  // ===== Страница покупки пакета: QR → приложение =====
  //
  // ⛔ ПОЧЕМУ ЗДЕСЬ QR, А НЕ КНОПКА «КУПИТЬ». Веб-оплаты у нас нет: покупка
  // живёт только в приложении, через App Store и Google Play. Значит задача
  // страницы — не продать, а довести человека до покупки на телефоне, и
  // довести СРАЗУ К НУЖНОМУ ПАКЕТУ, а не в приложение вообще.
  //
  // ⚠️ ЧТОБЫ ССЫЛКА ДЕЙСТВИТЕЛЬНО ОТКРЫВАЛА ПРИЛОЖЕНИЕ, нужны ещё две вещи,
  // которых пока нет:
  //   1. приложение должно обрабатывать входящую ссылку и открывать экран
  //      пополнения с выбранным пакетом (работа Flutter);
  //   2. на домене должны лежать файлы связи — `.well-known/assetlinks.json`
  //      для Android и `.well-known/apple-app-site-association` для iOS,
  //      иначе телефон откроет страницу в браузере, а не приложение.
  // До этого QR ведёт на страницу-переходник, и это честное поведение:
  // человек не упрётся в пустоту, а увидит ссылки на магазины.
  (function () {
    // Единственное место, где задан вид ссылки. Поменяется договорённость с
    // приложением — правится одна строка.
    function appLink(code) { return 'https://runpik.com/open?pack=' + encodeURIComponent(code); }

    var STORE = {
      appstore: 'https://apps.apple.com/app/runpik/id0000000000',
      play: 'https://play.google.com/store/apps/details?id=com.runpik.app'
    };

    var SUPA = 'https://wnbtsqfdlbjwtetppdng.supabase.co';
    var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduYnRzcWZkbGJqd3RldHBwZG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDQwMDAsImV4cCI6MjA5MzcyMDAwMH0.7mvR-FGSAzTZGRUzcz0tkGmNxWX3uwDxhtejrcwxxPM';

    var TX = {
      lead: {
        en: 'Scan this code with your phone — the Runpik app opens straight on this pack.',
        ru: 'Отсканируйте код телефоном — приложение Runpik откроется сразу на этом пакете.'
      },
      note: {
        en: 'Credits are bought in the app. The final price is set by the App Store or Google Play and depends on your country.',
        ru: 'Кредиты покупаются в приложении. Итоговую цену называет App Store или Google Play — она зависит от страны.'
      },
      credits: { en: '{n} credits', ru: '{n} кредитов' },
      back: { en: 'All packs', ru: 'Все пакеты' },
      missing: { en: 'Pack not found', ru: 'Пакет не найден' }
    };

    // В приватном окне обращение к хранилищу бросает исключение — без try
    // страница просто не нарисуется.
    var saved = null;
    try { saved = localStorage.getItem('runpik_lang'); } catch (e) {}
    var lang = saved || (navigator.language || 'en').slice(0, 2);
    if (lang !== 'ru' && lang !== 'hy') lang = 'en';
    function L(o) { return o[lang] || o.en; }
    function set(sel, t) { var e = document.querySelector(sel); if (e) e.textContent = t; }

    var code = new URLSearchParams(location.search).get('pack') || '';

    set('[data-bx="back"]', L(TX.back));
    set('[data-bx="lead"]', L(TX.lead));
    set('[data-bx="note"]', L(TX.note));
    document.querySelector('[data-bx="appstore"]').href = STORE.appstore;
    document.querySelector('[data-bx="play"]').href = STORE.play;

    // QR рисуем сразу: он зависит только от кода пакета, а не от сети.
    if (code) {
      new QRCode(document.getElementById('qr'), {
        text: appLink(code),
        width: 220, height: 220,
        colorDark: '#0A0A0B', colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    // Название, кредиты, цена и иконка — из той же таблицы, что и лендинг.
    fetch(SUPA + '/rest/v1/topup_packs?select=code,title,credits,price_display,icon_url&is_active=eq.true&code=eq.' + encodeURIComponent(code), {
      headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, Accept: 'application/json' }
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (rows) {
        if (!rows || !rows.length) { set('[data-bx="title"]', L(TX.missing)); return; }
        var p = rows[0];
        set('[data-bx="title"]', (p.title && (p.title[lang] || p.title.en)) || p.code);
        set('[data-bx="credits"]', L(TX.credits).replace('{n}', p.credits));
        set('[data-bx="price"]', p.price_display || '');
        var ic = document.querySelector('[data-bx="icon"]');
        if (ic && p.icon_url) { ic.src = p.icon_url; } else if (ic) { ic.remove(); }
      })
      .catch(function () { set('[data-bx="title"]', L(TX.missing)); });
  })();
</script>

</body>
</html>
